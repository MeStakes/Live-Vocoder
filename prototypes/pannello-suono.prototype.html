<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pannello del Suono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Nunito:wght@400;700;800&family=Pacifico&display=swap">
<style>
/* PROTOTIPO usa-e-getta, ticket "Pannello del Suono" (#14). Variante scelta: C, il banco del Suono in fondo alla finestra.
   Tutta la schermata sta nella finestra, senza scroll verticale: ruota e video si rimpiccioliscono con l'altezza.
   Le varianti A (Cassetto) e B (Sul poster) sono nella storia del branch prototype/pannello-suono.
   Camera e suono simulati: nessun audio. */
:root{
  /* Layout: finestra intera; sopra a sinistra titolo, Canzone e ruota di perline, a destra video-polaroid e comandi; sotto il banco del Suono */
  --rosa:#FF4F9A; --rosa-chiaro:#FF8FC4; --confetto:#FFD3E7;
  --viola:#6B2BD9; --viola-luce:#A27BFF;
  --prugna:#2B1145; --prugna-2:#43205F; --prugna-tenue:#6A4D7F; --notte:#1A0A2B;
  --crema:#FFF0D9; --lilla:#DCC6FF;
  --ombra:rgb(10 2 20 / .65);
  --f-titolo:"Pacifico","Brush Script MT",cursive;
  --f-etichetta:"Amatic SC","Arial Narrow",sans-serif;
  --f-testo:"Nunito","Avenir Next",system-ui,sans-serif;
  --retro:.025em .025em 0 var(--rosa-chiaro),.05em .05em 0 var(--rosa-chiaro),.075em .075em 0 var(--rosa-chiaro),.11em .11em .05em rgb(43 17 69 / .25);
  --perla:radial-gradient(circle at 35% 30%,var(--viola-luce),var(--viola) 75%);
  --perla-rosa:radial-gradient(circle at 35% 30%,var(--rosa-chiaro),var(--rosa) 75%);
  --ar:9/16; --arn:.5625;
  color-scheme:dark;
}
:root[data-format="orizzontale"]{--ar:16/9;--arn:1.7778}
html,body{height:100%}
body{margin:0;background:var(--confetto);color:var(--prugna);font:16px/1.45 var(--f-testo)}
[hidden]{display:none!important}
[data-act]{cursor:pointer}
[data-act]:focus-visible,input:focus-visible,.knob:focus-visible{outline:2px solid var(--viola);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}

.app{position:relative;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;padding:22px 32px 18px}
.left,.right{min-height:0;display:flex;flex-direction:column;gap:14px}
.right{align-items:center}
.head{display:flex;align-items:flex-end;gap:12px 22px;flex-wrap:wrap}
.poster{margin:0;font:400 clamp(2.4rem,7.5vh,6rem)/1.05 var(--f-titolo);color:var(--viola);text-shadow:var(--retro)}
.sign{display:flex;align-items:center;gap:12px;padding-bottom:.6vh}
.by{font:700 1.4rem/1 var(--f-etichetta);letter-spacing:.14em;text-transform:uppercase}
.app-icon{--s:52px;flex:none;width:var(--s);height:var(--s);box-sizing:border-box;padding-bottom:calc(var(--s)*.06);border-radius:calc(var(--s)*.225);background:linear-gradient(var(--rosa-chiaro),var(--rosa));display:grid;place-items:center;font:400 calc(var(--s)*.52)/1 var(--f-titolo);color:var(--viola);text-shadow:.025em .025em 0 var(--crema),.05em .05em 0 var(--crema),.075em .075em 0 var(--crema),.11em .11em .05em var(--ombra)}
.tools{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.song{all:unset;cursor:pointer;padding:8px 18px;border-radius:999px;background:var(--crema);font-weight:800;box-shadow:inset 0 0 0 2px var(--rosa-chiaro)}
.song b{font:400 1.1rem/1 var(--f-titolo);color:var(--rosa)}

/* menu Canzone: scegli, crea, rinomina, elimina */
.songmenu{position:absolute;z-index:7;top:calc(100% + 8px);left:0;width:min(340px,90vw);max-height:calc(100dvh - 180px);overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:var(--crema);box-shadow:0 0 0 2px var(--rosa-chiaro),0 24px 48px -16px var(--ombra)}
.songmenu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.songrow{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 12px;border-radius:14px}
.songrow b{font:400 1.15rem/1.25 var(--f-titolo);color:var(--viola)}
.songrow small{font-size:.75rem;font-weight:700;color:var(--prugna-tenue);white-space:nowrap}
.songrow:hover{background:var(--confetto)}
.songrow[aria-current="true"]{background:var(--confetto);box-shadow:inset 0 0 0 2px var(--rosa)}
.newsong{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:14px;background:var(--rosa);color:var(--crema);font-weight:800}
.sform{display:flex;flex-direction:column;gap:8px}
#song-name{padding:8px 14px;border:0;border-radius:999px;background:var(--confetto);color:var(--prugna);font:400 1.05rem/1.3 var(--f-titolo);box-shadow:inset 0 0 0 2px var(--rosa-chiaro)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.pill.small{padding:6px 12px;font-size:.8rem}
.pill.danger{background:var(--rosa);color:var(--crema);box-shadow:none}
.err{margin:0;font-size:.8rem;font-weight:800;color:var(--rosa)}
.pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--crema);color:var(--prugna);font-weight:800;font-size:.9rem;box-shadow:inset 0 0 0 2px var(--rosa-chiaro)}

/* ruota-braccialetto: grande quanto lo spazio rimasto; perline viola, quella suonata rosa */
.wheel-box{position:relative;flex:1;min-height:0;container-type:size}
.wheel{position:relative;width:min(100cqw,100cqh,300px);aspect-ratio:1;container-type:size}
.wheel::before{content:"";position:absolute;inset:15cqw;border-radius:50%;border:2px solid var(--rosa-chiaro)}
.wheel button{all:unset;cursor:pointer;position:absolute;left:50%;top:50%;width:25cqw;height:25cqw;margin:-12.5cqw;border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--perla);color:var(--crema);box-shadow:inset -3px -3px 6px rgb(43 17 69 / .3);transform:rotate(var(--a)) translateY(-35cqw) rotate(calc(-1 * var(--a)));transition:box-shadow .15s}
.wheel button b{font:400 6cqw/1.25 var(--f-titolo);white-space:nowrap}
.wheel button small{font-size:3.8cqw;font-weight:800}
.wheel button.on{background:var(--perla-rosa);box-shadow:0 0 22px var(--rosa)}
.wheel button.editing{box-shadow:0 0 0 4px var(--crema),0 0 0 7px var(--viola)}
.core{position:absolute;inset:34%;display:grid;place-items:center;text-align:center;font:400 9cqw/1.1 var(--f-titolo);color:var(--rosa)}
.wheel button.long b{font-size:4.6cqw}
.core.long{font-size:6.5cqw}
.hint{margin:0;font-size:.8rem;font-weight:700}

/* editor della Nota: galleggia accanto alla ruota, così non spinge giù niente */
.editor{position:absolute;z-index:4;top:0;left:calc(min(100cqw,100cqh,300px) + 16px);width:min(340px,calc(100cqw - min(100cqw,100cqh,300px)));min-width:260px;max-height:100cqh;overflow-y:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:24px;background:var(--crema);box-shadow:0 0 0 2px var(--rosa-chiaro),0 18px 36px -18px var(--viola)}
.editor h2{margin:0;font-size:1rem;font-weight:800}
.editor h2 b{font:400 1.3rem/1 var(--f-titolo);color:var(--rosa)}
.row{display:flex;flex-direction:column;gap:5px}
.row > span{font-size:.8rem;font-weight:800;color:var(--viola)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button,.done{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:800;background:var(--confetto);color:var(--prugna);box-shadow:inset 0 0 0 2px var(--lilla)}
.chips button[aria-pressed="true"]{background:var(--viola);color:var(--crema);box-shadow:none}
.done{align-self:flex-start;padding:7px 20px;background:var(--rosa);color:var(--crema);box-shadow:none}

/* video: la polaroid prende l'altezza rimasta, il riquadro si adatta al Formato */
.polaroid{position:relative;flex:1;min-height:0;width:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:14px 14px 0;background:var(--crema);border-radius:6px;box-shadow:0 24px 50px -24px var(--ombra)}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:120px;height:26px;margin-left:-60px;background:var(--rosa-chiaro);opacity:.85;transform:rotate(3deg)}
.frame-box{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.frame{width:min(calc(100cqw - 16px),calc((100cqh - 16px) * var(--arn)));aspect-ratio:var(--ar);border-radius:4px;overflow:hidden;outline:2px dashed var(--rosa);outline-offset:6px}
.frame canvas{display:block;width:100%;height:100%}
.cap{margin:0;padding:8px 0;text-align:center;font:700 1.2rem/1.1 var(--f-etichetta)}
.dock{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--crema);box-shadow:inset 0 0 0 2px var(--rosa-chiaro)}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 12px;border-radius:999px;font-weight:800;font-size:.88rem;color:var(--prugna)}
.seg button[aria-pressed="true"]{background:var(--viola);color:var(--crema)}
.rec{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;background:var(--rosa);color:var(--crema);font-weight:800;font-size:1.05rem;box-shadow:0 12px 30px -12px var(--rosa)}
.rec::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--crema)}

/* banco del Suono */
.desk{padding:10px 24px 14px;background:var(--prugna);color:var(--crema);border-top:3px dashed var(--rosa-chiaro)}
.desk-head{display:flex;align-items:center;gap:10px 14px}
.desk-head h3{margin:0;font:400 1.45rem/1 var(--f-titolo);color:var(--rosa-chiaro)}
.lcd{flex:1;min-width:0;margin:0;padding:6px 14px;border-radius:12px;background:var(--notte);color:var(--confetto);font-size:.8rem;line-height:1.35;height:calc(2 * 1.35em);overflow:hidden;display:flex;align-items:center}
.pill.dark{background:transparent;color:var(--crema);box-shadow:inset 0 0 0 2px var(--rosa-chiaro);padding:7px 16px}
.guide{all:unset;cursor:pointer;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--viola);color:var(--crema);font:400 1.3rem/1 var(--f-titolo);box-shadow:0 0 0 2px var(--rosa-chiaro)}
.desk-body{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:10px;align-items:flex-start}
.grp{display:flex;flex-direction:column;gap:6px}
.grp > span{font:700 1.05rem/1 var(--f-etichetta);letter-spacing:.14em;text-transform:uppercase;color:var(--rosa-chiaro)}
.grp > div{display:flex;gap:6px}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;width:74px;text-align:center;cursor:ns-resize;touch-action:none;user-select:none;border-radius:12px}
.dial{--p:.5;position:relative;width:52px;height:52px;border-radius:50%;background:conic-gradient(from 225deg,var(--rosa) calc(var(--p) * 270deg),rgb(255 240 217 / .15) 0 270deg,transparent 0)}
.dial::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--perla);box-shadow:inset -3px -3px 6px rgb(26 10 43 / .4)}
.dial::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:17px;margin:-17px 0 0 -1.5px;border-radius:2px;background:var(--crema);transform-origin:50% 100%;transform:rotate(calc(-135deg + var(--p) * 270deg))}
.knob b{font-size:.72rem;font-weight:800;line-height:1.2}
.knob output{font-size:.72rem;color:var(--confetto);font-variant-numeric:tabular-nums}
.knob.off{opacity:.35}
.effknob{display:flex;align-items:center;gap:10px}
.effknob .dial{all:unset;cursor:pointer;--p:.5;position:relative;width:64px;height:64px;border-radius:50%;background:rgb(255 240 217 / .15)}
.effknob .dial::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--perla-rosa)}
.effknob .dial::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:22px;margin:-22px 0 0 -2px;border-radius:2px;background:var(--crema);transform-origin:50% 100%;transform:rotate(calc(-135deg + var(--p) * 270deg))}
.effnames{display:flex;flex-direction:column;gap:3px}
.effnames button{all:unset;cursor:pointer;font-weight:800;font-size:.85rem;color:rgb(255 240 217 / .55)}
.effnames button[aria-pressed="true"]{color:var(--rosa-chiaro)}

/* pannello laterale (Impostazioni, Guida) */
.scrim{position:absolute;inset:0;z-index:5;background:rgb(26 10 43 / .35)}
.sheet{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(440px,100%);box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:22px 22px 28px;background:var(--crema);color:var(--prugna);box-shadow:-20px 0 50px -20px var(--ombra)}
.sheet h2{margin:0;padding-right:40px;font:400 1.9rem/1.1 var(--f-titolo);color:var(--viola)}
.x{all:unset;cursor:pointer;position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--confetto);font-weight:800;font-size:1.2rem}
.lbl{font-size:.8rem;font-weight:800;color:var(--viola);margin:0}
.ctx{margin:0;font-size:.85rem}
.gl{margin:0;display:grid;gap:4px 0}
.gl dt{font-weight:800;color:var(--viola);margin-top:8px}
.gl dd{margin:0;font-size:.88rem}
.only{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--lilla);color:var(--prugna);white-space:nowrap}
.vset{display:flex;flex-direction:column;gap:14px}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;font-weight:800}
.vrow b{font-weight:700;color:var(--prugna-tenue)}
.switch{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:800;color:var(--prugna)}
.track{position:relative;flex:none;width:42px;height:24px;border-radius:999px;background:var(--crema);box-shadow:inset 0 0 0 2px var(--rosa-chiaro);transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--rosa-chiaro);transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--viola);box-shadow:none}
.switch[aria-checked="true"] .track::after{transform:translateX(18px);background:var(--crema)}
#titolo{width:11rem;max-width:100%;padding:6px 12px;border:0;border-radius:999px;background:var(--confetto);color:var(--prugna);font:400 1rem/1.3 var(--f-titolo);box-shadow:inset 0 0 0 2px var(--rosa-chiaro)}

/* finestra stretta (non è il Mac di Keopees): si impila e scorre */
@media (max-width:820px){.app{height:auto;min-height:100dvh}.main{grid-template-columns:1fr}.wheel-box,.polaroid{flex:none;height:60vh}}
@media (prefers-reduced-motion:reduce){.track,.track::after,.wheel button{transition:none}}
</style>

<div class="app">
  <main class="main">
    <div class="left">
      <div class="head">
        <p class="poster">Live<br>Vocoder</p>
        <div class="sign"><div class="app-icon">K</div><span class="by">by Keopees</span></div>
      </div>
      <div class="tools">
        <button class="song" data-act="songmenu" aria-haspopup="dialog">Canzone: <b data-bind="song"></b> ▾</button>
        <button class="pill" data-act="panel" data-val="imp">Impostazioni</button>
        <div id="slot-menu"></div>
      </div>
      <div class="wheel-box">
        <div class="wheel" id="wheel"><div class="core" data-bind="chord">Lam</div></div>
        <div class="editor" id="editor" hidden>
          <h2>Nota da <span data-bind="edDita"></span>: <b data-bind="edName"></b></h2>
          <div class="row"><span>Base</span><div class="chips" id="chips-root"></div></div>
          <div class="row"><span>Tipo</span><div class="chips" id="chips-type"></div></div>
          <div class="row"><span>Ottava</span><div class="chips" id="chips-oct"></div></div>
          <button class="done" data-act="done">Fatto</button>
        </div>
      </div>
      <p class="hint">Tocca una Nota per cambiarla.</p>
    </div>

    <div class="right">
      <div class="polaroid"><div class="frame-box"><div class="frame"><canvas></canvas></div></div><p class="cap">questo finisce nel video ♥</p></div>
      <div class="dock">
        <div class="seg" role="group" aria-label="Modalità"><button data-act="mode" data-val="accordi">Accordi</button><button data-act="mode" data-val="nota">Nota singola</button></div>
        <div class="seg" role="group" aria-label="Formato"><button data-act="format" data-val="verticale">Verticale</button><button data-act="format" data-val="orizzontale">Orizzontale</button></div>
        <button class="rec" data-act="rec">Registra 00:00</button>
      </div>
    </div>
  </main>
  <section class="desk" id="desk" aria-label="Suono"></section>
  <div id="slot-sheet"></div>
</div>

<script>
const NOTE = ['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
const TYPES = {M:{label:'Maggiore', suf:'', iv:[0,4,7]}, m:{label:'Minore', suf:'m', iv:[0,3,7]}, s7:{label:'Settima', suf:'7', iv:[0,4,7,10]},
               maj7:{label:'Maj7', suf:'maj7', iv:[0,4,7,11]}, sus:{label:'Sus4', suf:'sus4', iv:[0,5,7]}};
const OCT = [[-1,'Bassa'],[0,'Media'],[1,'Alta']];

// --- il Suono: Effetto + manopole decise in "Suono del vocoder" (#13), con i nomi proposti per Keopees
const EFF = {
  coro: {name:'Coro', sub:'La tua voce copiata sull\'accordo della Nota, come un coro.'},
  vocoder: {name:'Vocoder', sub:'La tua voce fa cantare le parole a un synth.'},
  spento: {name:'Spento', sub:'Voce pulita, e sopra gli accordi come una tastiera.'},
};
const EKEYS = Object.keys(EFF), ALL = EKEYS;
const steps = (a, b, s) => Array.from({length: Math.round((b - a) / s) + 1}, (_, i) => +(a + i * s).toFixed(2));
const it = v => v.toLocaleString('it-IT');
const pct = v => v + '%';
const KN = [
  {k:'i1', name:'Intensità con 1 dito', cname:'Con 1 dito', vals:steps(0,100,5), def:60, fmt:pct, for:ALL,
   help:'Quanto Effetto senti, rispetto alla tua voce pulita, quando alzi 1 dito della seconda mano. Con Spento è quanto forte suonano gli accordi.'},
  {k:'i5', name:'Intensità con 5 dita', cname:'Con 5 dita', vals:steps(0,100,5), def:90, fmt:pct, for:ALL,
   help:'Come sopra, ma con 5 dita alzate. Tra 1 e 5 dita l\'Effetto cresce un po\' alla volta.'},
  {k:'voci', name:'Pienezza', vals:[3,4,5], def:4,
   fmt:v => ({3:'3 · leggero', 4:'4 · col basso', 5:'5 · pieno'})[v], for:ALL,
   help:'Quante note suonano insieme in ogni accordo. 3 = leggero, 4 aggiunge il basso, 5 aggiunge anche una nota in alto.'},
  {k:'scivola', name:'Scivolata', vals:steps(0,400,20), def:0, fmt:v => v ? it(v / 1000) + ' s' : 'niente', for:ALL,
   help:'Quando cambi Nota le note scivolano verso il nuovo accordo invece di saltare. Niente = salto netto.'},
  {k:'timbro', name:'Timbro', vals:['sega','supersaw','quadra'], def:'supersaw',
   fmt:v => ({sega:'Sega', supersaw:'Supersaw', quadra:'Quadra'})[v], for:['vocoder','spento'],
   help:'Il colore del synth. Sega graffia, Supersaw è largo e pieno (il suono pop), Quadra è più vuoto, da videogioco.'},
  {k:'bande', name:'Dettaglio', vals:[8,12,16,24,32], def:24, short:v => v + ' fette',
   fmt:v => `${v} fette, ${({8:'tanto robot', 12:'robot', 16:'a metà', 24:'parole chiare', 32:'chiarissime'})[v]}`, for:['vocoder'],
   help:'In quante fette il Vocoder taglia la tua voce. Poche fette = più robot, tante = le parole si capiscono meglio.'},
  {k:'morb', name:'Morbidezza', vals:steps(0,100,5), def:0, fmt:pct, for:['vocoder','spento'],
   help:'Rende il synth più scuro e più dolce, e un po\' più lento a seguire la voce.'},
  {k:'cons', name:'Consonanti chiare', cname:'Consonanti', vals:steps(0,100,5), def:15, fmt:pct, for:['coro','vocoder'],
   help:'Fa passare le S, le T e il fiato della tua voce vera, così le parole si capiscono anche con tanto Effetto.'},
  {k:'gate', name:'Anti-fruscio', vals:steps(-75,-30,5), def:-75, short:v => v <= -75 ? 'spento' : it(v) + ' dB',
   fmt:v => v <= -75 ? 'spento' : `${v <= -60 ? 'leggero' : v <= -45 ? 'medio' : 'forte'} (${it(v)} dB)`, for:ALL,
   help:'Chiude il microfono quando non canti, così non si sentono fruscii e rumori di casa. Più forte taglia di più, ma può mangiare i finali delle frasi.'},

  const bind = {chord, song: songs[st.song].name, edDita: ed ? dita(st.edit) : '', edName: ed ? NOTE[ed.r] + TYPES[ed.t].suf + octMark(ed.o) : ''};
  for (const [k, val] of Object.entries(bind)) $$(`[data-bind="${k}"]`).forEach(el => el.textContent = val);

  const pressed = (act, val) => $$(`[data-act="${act}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.val === String(val)));
  pressed('mode', st.mode); pressed('format', st.format); pressed('mano', st.mano); pressed('from', st.ui.form?.from);
  if (ed) { pressed('root', ed.r); pressed('type', ed.t); pressed('oct', ed.o); }
  $$('[data-act="sw"]').forEach(b => b.setAttribute('aria-checked', st[b.dataset.val]));

function sync() {
  $$('[data-show]').forEach(o => { const K = KM[o.dataset.show]; o.textContent = (K.short || K.fmt)(st.snd[K.k]); });
  $$('.knob[data-knob]').forEach(kn => {
    const K = KM[kn.dataset.knob], i = idx(K.k);
    kn.querySelector('.dial').style.setProperty('--p', i / (K.vals.length - 1));
    kn.setAttribute('aria-valuenow', i); kn.setAttribute('aria-valuetext', K.fmt(st.snd[K.k]));
  });

// Il display spiega la manopola sotto il mouse; "solo Vocoder" sta qui invece che sotto la manopola.
function setLcd(k) {
  const el = $('[data-lcd]');
  if (!el) return;
  if (!k) return void (el.textContent = LCD);
  if (k.startsWith('eff:')) { const E = EFF[k.slice(4)]; return void (el.textContent = `${E.name}: ${E.sub}`); }
  const K = KM[k];
  el.textContent = `${K.name}: ${K.help}${K.for.length < 3 ? ` Vale ${onlyLabel(K)}.` : ''}`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'), u = st.ui;
  const outside = u.menu && !e.target.closest('.songmenu,[data-act="songmenu"]');
  if (outside) { u.menu = false; u.form = null; }
  if (!b) { if (outside) build(); return; }
  const a = b.dataset.act, v = b.dataset.val, ed = st.beads[st.edit];
  if (a === 'songmenu') { u.menu = !u.menu; u.form = null; u.err = ''; }
  if (a === 'song') { if (+v !== st.song) openSong(+v); u.menu = false; }
  if (a === 'new') { u.form = {kind:'new', from:'copia'}; u.draft = ''; u.err = ''; }
  if (a === 'from') u.form.from = v;
  if (a === 'rename') { u.form = {kind:'rename'}; u.draft = songs[st.song].name; u.err = ''; }
  if (a === 'del') u.form = {kind:'del'};
  if (a === 'cancel') { u.form = null; u.err = ''; }
  if (a === 'create' && !(u.err = checkName(u.draft, -1))) {
    songs[st.song].data = snapshot();
    songs.push({name:u.draft.trim(), data:u.form.from === 'copia' ? snapshot() : structuredClone(DEF_SONG)});
    openSong(songs.length - 1, false); u.menu = false; u.form = null;
  }
  if (a === 'dorename' && !(u.err = checkName(u.draft, st.song))) { songs[st.song].name = u.draft.trim(); u.form = null; }
  if (a === 'dodel') { songs.splice(st.song, 1); st.song = 0; openSong(0, false); u.form = null; }
  if (a === 'mode') st.mode = v;
  if (a === 'format') st.format = v;
  if (a === 'mano') st.mano = v;
  if (a === 'sw') st[v] = !st[v];
  if (a === 'bead') { st.edit = st.edit === +v ? -1 : +v; if (st.edit >= 0) st.i = st.edit; }
  if (a === 'done') st.edit = -1;
  if (ed && a === 'root') ed.r = +v;
  if (ed && a === 'type') ed.t = v;
  if (ed && a === 'oct') ed.o = +v;
  if (a === 'eff') st.eff = v;
  if (a === 'effcycle') st.eff = EKEYS[(EKEYS.indexOf(st.eff) + 1) % EKEYS.length];
  if (a === 'reset') KN.forEach(K => st.snd[K.k] = K.def);
  if (a === 'panel') u.panel = v;
  if (a === 'close') u.panel = null;
  if (a === 'desk') u.desk = !u.desk;
  lastCycle = performance.now();
  build();
});

// --- video simulato (dal prototipo Stile grafico): l'onda segue Effetto e Intensità
const HAND = [[.50,.95],[.38,.86],[.29,.75],[.23,.65],[.18,.56],[.40,.58],[.37,.42],[.35,.31],[.34,.21],[.50,.56],[.50,.38],[.50,.26],[.50,.15],[.59,.58],[.61,.42],[.62,.31],[.63,.22],[.67,.63],[.71,.51],[.73,.43],[.75,.35]];

const css = getComputedStyle(document.documentElement);

const rgba = (hex, a) => `rgba(${[1,3,5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',')},${a})`;
const rnd = i => { const v = Math.sin(i * 127.1) * 43758.5453; return v - Math.floor(v); };
const GLITTER = Array.from({length: 36}, (_, i) => ({x: rnd(i), y: rnd(i + 99) * .8, s: .4 + rnd(i + 7) * .8, p: rnd(i + 3) * 6.28, v: 1 + rnd(i + 11) * 2}));
const fold = [0,0,0,0,0], fold2 = [0,0,0,0,0];
let lastCycle = performance.now(), lastLv = performance.now();

function handPoints(fd) {
  return HAND.map((p, j) => {
    const f = FINGERS.findIndex(fg => fg.includes(j));
    if (f < 0) return p;
    const k = fd[f], order = FINGERS[f].indexOf(j);
    if (f === 0) return [p[0] + (.46 - p[0]) * k * .7 * (order / 3), p[1] + (.72 - p[1]) * k * .7 * (order / 3)];
    if (order === 0) return p;
    const m = HAND[FINGERS[f][0]];
    const q = [m[0] + (p[0] - m[0]) * .25, m[1] + .05 * order];
    return [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
  });
}
function star(x, cx, cy, r) {
  x.beginPath(); x.moveTo(cx, cy - r);
  x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r);
  x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill();
}
function heart(x, cx, cy, r) {
  x.beginPath(); x.moveTo(cx, cy + r * .9);

  x.bezierCurveTo(cx + r * .6, cy - r * 1.3, cx + r * 1.6, cy - r * .2, cx, cy + r * .9);
  x.fill(); x.stroke();
}
function drawHand(x, P, m, t, glow, raised) {
  x.lineCap = 'round'; x.strokeStyle = C.crema; x.lineWidth = m * .011;
  x.shadowColor = glow; x.shadowBlur = m * .035;
  x.beginPath(); BONES.forEach(([a, b]) => { x.moveTo(...P[a]); x.lineTo(...P[b]); }); x.stroke();
  x.shadowBlur = 0; x.lineWidth = m * .004;
  const BEAD = [C.rosa, C.lilla, C.crema, C['viola-luce']];
  P.forEach((p, j) => {
    const f = [4, 8, 12, 16, 20].indexOf(j);
    if (f >= 0 && raised(f)) {
      x.strokeStyle = C.crema; x.fillStyle = glow; heart(x, p[0], p[1], m * .028);
      x.fillStyle = C.crema;

    }
    x.strokeStyle = C.prugna; x.fillStyle = BEAD[j % 4];

function draw(cv, t) {

  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const x = cv.getContext('2d'), m = Math.min(W, H);
  const lvl = lvPct(st.lv) / 100;
  x.save();
  if (st.specchio) { x.translate(W, 0); x.scale(-1, 1); }
  let g = x.createLinearGradient(0, 0, 0, H);
  if (st.filtro) {
    g.addColorStop(0, C['prugna-2']); g.addColorStop(1, C.prugna);
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    g = x.createRadialGradient(W * .4, H * .42, 0, W * .4, H * .42, m * .9);
    g.addColorStop(0, rgba(C.rosa, .38)); g.addColorStop(1, rgba(C.rosa, 0));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = rgba(C.prugna, .75);
  } else {
    g.addColorStop(0, '#9A8F86'); g.addColorStop(1, '#5B524C');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(40,32,30,.7)';
  }
  x.beginPath(); x.ellipse(W * .36, H * .4, m * .13, m * .16, 0, 0, 7); x.fill();
  x.beginPath(); x.ellipse(W * .36, H * .95, m * .38, m * .26, 0, 0, 7); x.fill();
  if (st.filtro) GLITTER.forEach(s => { x.fillStyle = rgba(C.crema, .2 + .8 * Math.max(0, Math.sin(t * s.v + s.p))); star(x, s.x * W, s.y * H, m * .014 * s.s); });
  const hs = m * .6;
  const L = st.mano === 'sinistra', flip = (pts, f) => f ? pts.map(([px, py]) => [1 - px, py]) : pts;
  const ox = W * (L ? .68 : .32) - hs / 2 + Math.sin(t * .8) * m * .02, oy = H * .42 - hs / 2 + Math.sin(t * 1.1) * m * .015;
  drawHand(x, flip(handPoints(fold), !L).map(([px, py]) => [ox + px * hs, oy + py * hs]), m, t, C.rosa, f => fold[f] < .5);
  const hs2 = m * .38, ox2 = W * (L ? .16 : .84) - hs2 / 2 + Math.sin(t * .9 + 2) * m * .015, oy2 = H * .45 - hs2 / 2;
  drawHand(x, flip(handPoints(fold2), L).map(([px, py]) => [ox2 + px * hs2, oy2 + py * hs2]), m, t, C['viola-luce'], f => fold2[f] < .5);
  const bx = W * (L ? .05 : .95), r5 = m * .02;
  x.lineWidth = m * .004; x.strokeStyle = C.crema;
  for (let k = 0; k < 5; k++) {
    x.beginPath(); x.arc(bx, H * .62 - k * r5 * 2.6, r5, 0, 7);
    x.fillStyle = k >= st.lv ? rgba(C.crema, .2) : k === st.lv - 1 ? C.rosa : C['viola-luce'];
    x.fill(); if (k < st.lv) x.stroke();
  }
  x.restore();
  x.fillStyle = rgba(C.crema, .55); x.textAlign = 'right';
  x.font = `${Math.round(m * .032)}px Nunito, sans-serif`;
  x.fillText(`camera simulata · ${EFF[st.eff].name} ${lvPct(st.lv)}%`, W - m * .05, m * .07);
  x.textAlign = 'left';
  const fs = freqs(st.beads[st.i]), y0 = H * .86, amp = Math.min(H * .06, m * .09) * (.25 + .75 * lvl);
  // Coro e Vocoder: l'onda segue la voce (respira); Spento: accordi fissi come una tastiera
  const env = st.eff !== 'spento' ? .55 + .45 * Math.abs(Math.sin(t * 1.9) * Math.sin(t * .6 + 1)) : .85;
  const wave = (scale, alpha) => {
    x.beginPath();
    for (let i = 0; i <= 220; i++) {
      const u = i / 220;
      const y = fs.reduce((s, f) => s + Math.sin(2 * Math.PI * u * f / 55 - t * f / 60), 0) / fs.length;
      x[i ? 'lineTo' : 'moveTo'](u * W, y0 + y * amp * env * scale);
    }
    const lg = x.createLinearGradient(0, 0, W, 0);
    lg.addColorStop(0, rgba(C.rosa, alpha)); lg.addColorStop(1, rgba(C['viola-luce'], alpha));
    x.strokeStyle = lg; x.stroke();
  };
  x.shadowColor = C.rosa; x.shadowBlur = m * .03;
  x.lineWidth = m * .004; wave(-.6, .35);
  x.lineWidth = m * .008; wave(1, 1);
  x.shadowBlur = 0;
  const chord = name(st.beads[st.i]), s = m * .11, tx = m * .06, ty = m * .05 + s * 1.05, d = Math.max(2, Math.round(s * .07));
  x.font = `${s}px Pacifico, cursive`;
  x.fillStyle = rgba(C.prugna, .55); x.fillText(chord, tx + d * 1.8, ty + d * 1.8);
  x.fillStyle = C.crema; for (let i = d; i > 0; i--) x.fillText(chord, tx + i, ty + i);
  x.fillStyle = C.rosa; x.fillText(chord, tx, ty);
  const title = songs[st.song].name.trim();
  if (st.titolo && title) {
    const sx = tx + x.measureText(chord).width + s * .2, text = '– ' + title;
    let ts = s * .5;
    x.font = `${ts}px Pacifico, cursive`;
    const room = W - m * .05 - sx, w = x.measureText(text).width;
    if (w > room) { ts *= room / w; x.font = `${ts}px Pacifico, cursive`; }
    x.fillStyle = rgba(C.prugna, .6); x.fillText(text, sx + 2, ty + 2);
    x.fillStyle = C.crema; x.fillText(text, sx, ty);
  }
}

function frame(now) {
  if (st.edit < 0 && now - lastCycle > 2600) { st.i = (st.i + 1) % st.beads.length; lastCycle = now; paint(); }
  if (now - lastLv > 3700) { st.lv = st.lv % 5 + 1; lastLv = now; } // seconda mano simulata
  const ease = (fd, n) => {
    const open = new Set(OPEN_ORDER.slice(0, n));
    fd.forEach((v, f) => { const target = open.has(f) ? 0 : 1; fd[f] = reduce ? target : v + (target - v) * .15; });
  };
  ease(fold, st.i + 1); ease(fold2, st.lv);
  draw($('canvas'), reduce ? 1.3 : now / 1000);
  requestAnimationFrame(frame);
}

build();
requestAnimationFrame(frame);
</script>
